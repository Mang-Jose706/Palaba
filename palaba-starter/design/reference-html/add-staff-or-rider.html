<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=528"><title>Palaba - Add staff or rider</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"><style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#232F5C}
*{box-sizing:border-box}
a{color:#3D7BEA}a:hover{color:#2F63C9}
h2{margin:0;font-size:18px;line-height:26px;font-weight:600}
h3{margin:0;font-size:14px;line-height:20px;font-weight:600}
p{margin:0}
.cap{color:#6B7393;font-size:13px;line-height:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;border:0;font:600 14px 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap;flex:1}
.btn-p{background:linear-gradient(90deg, #7493F7, #2DCDE7);color:#fff}a.btn-p:hover{background:linear-gradient(90deg, #6584EE, #1FBCD8);color:#fff}
.btn-s{background:#EAF2FE;color:#3D7BEA}
.btn-d{background:#AD2A1C;color:#fff}a.btn-d:hover{background:#8E2216;color:#fff}
.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500}
.inp{height:44px;border:1px solid #DFE6E4;border-radius:8px;padding:0 12px;font:400 14px 'Plus Jakarta Sans',system-ui,sans-serif;color:#232F5C;background:#fff;width:100%}
.seg{display:flex;gap:4px;padding:4px;background:#EEF2F7;border-radius:12px}
.seg button{flex:1;min-height:40px;border:0;border-radius:8px;background:transparent;font:600 13px 'Plus Jakarta Sans',system-ui,sans-serif;color:#6B7393;cursor:pointer;padding:0 6px}
.seg .on{background:#fff;color:#3D7BEA}
.ln{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:#6B7393}
.ln b{color:#232F5C;font-weight:500}
.ln.tot{color:#232F5C;font-weight:600}.ln.tot b{font-weight:700}
.opts{display:flex;flex-direction:column;border:1px solid #DFE6E4;border-radius:8px;overflow:hidden}
.opt{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;font-size:14px;border-top:1px solid #DFE6E4;cursor:pointer}
.opt:first-child{border-top:0}
.opt.on{background:#F2F7FF;font-weight:600}
.rad{width:18px;height:18px;border-radius:999px;border:1.5px solid #A3A9BE;flex:none;background:#fff}
.opt.on .rad{border:5px solid #3D7BEA}
.chk{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:20px;cursor:pointer}
.box{width:20px;height:20px;border-radius:5px;border:1.5px solid #A3A9BE;flex:none;display:flex;align-items:center;justify-content:center;margin-top:0}
.chk.on .box{background:#3D7BEA;border-color:#3D7BEA}
.note{border-radius:8px;padding:12px;font-size:13px;line-height:18px}
.warn{background:#FCF1DC;color:#83520A}.info{background:#EAF2FE;color:#1F4FA8}.gray{background:#EEF2F7;color:#3E4970}
.badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:16px}
.b-n{background:#EDF0F2;color:#465462}.b-p{background:#E6F0FA;color:#1B5A9E}.b-s{background:#E3F5EA;color:#146C3C}
.sms{background:#F5F8F7;border:1px solid #DFE6E4;border-radius:12px 12px 12px 4px;padding:12px;font-size:13px;line-height:19px}

.nav a.on{background:#ABD8FA !important;color:#232F5C !important}
html,body{margin:0;background:#FFFFFF}</style></head><body><div style="width:480px;padding:24px;"><section role="dialog" aria-modal="true" aria-labelledby="a-title" style="width: 480px; background: rgb(255, 255, 255); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: rgba(20, 33, 31, 0.25) 0px 12px 32px;"><div style="display: flex; justify-content: space-between; align-items: center;"><h2 id="a-title">Add staff or rider</h2><a href="Settings.dc.html" aria-label="Close" style="color: rgb(107, 115, 147); display: flex; min-width: 44px; min-height: 44px; align-items: center; justify-content: flex-end;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a></div><div class="f">Role<div class="seg" role="group" aria-label="Role"><button>Staff</button><button class="on" aria-pressed="true">Rider</button></div></div><p class="cap" style="margin-top: -8px;">Riders only see their own trips. Staff can take orders, record payments, and edit customers.</p><label class="f">Full name<input class="inp" value="Arnel Bautista"></label><label class="f">Mobile number<input class="inp" value="0917 555 0133"></label><label class="f">Username<input class="inp" value="arnel"></label><label class="f">Temporary password<input class="inp" value="labada-4821"></label><p class="cap" style="margin-top: -8px;">They'll set a new password the first time they sign in.</p><div class="chk on" role="checkbox" aria-checked="true"><span class="box"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span>Active (can sign in)</span></div><div style="display: flex; gap: 12px;"><a class="btn btn-s" href="Settings.dc.html">Cancel</a><a class="btn btn-p" href="Settings.dc.html">Add rider</a></div></section></div></body></html>
